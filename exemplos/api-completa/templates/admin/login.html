{% extends "admin/base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<section class="login painel">
  <h1>Área administrativa</h1>
  <p>Entre com o usuário do Supabase (e-mail e senha) para administrar grupos, tokens e requisições.</p>
  <form method="post">
    {% if proximo %}<input type="hidden" name="next" value="{{ proximo }}">{% endif %}
    <label>E-mail
      <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required>
    </label>
    <label>Senha
      <input type="password" name="senha" autocomplete="current-password" required>
    </label>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
