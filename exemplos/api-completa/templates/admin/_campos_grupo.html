<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Nome do grupo
  <input name="nome" value="{{ grupo.nome if grupo else '' }}" placeholder="Ex.: Grupo 1" required>
</label>
<label>Turma
  <input name="turma" value="{{ (grupo.turma or '') if grupo else '' }}" placeholder="Ex.: 2º DS A">
</label>
<label class="largo">Descrição do projeto
  <textarea name="descricao" rows="3" placeholder="Ex.: Placar eletrônico para o campeonato interclasse">{{ (grupo.descricao or '') if grupo else '' }}</textarea>
</label>
<label class="largo">URL do projeto
  <input type="url" name="url" value="{{ (grupo.url or '') if grupo else '' }}" placeholder="https://usuario.github.io/projeto">
</label>
{% if not grupo %}
<label class="largo">Integrantes (um por linha)
  <textarea name="integrantes" rows="4" placeholder="Ana Souza&#10;Bruno Lima"></textarea>
</label>
{% endif %}
