<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Nome do grupo
  <input name="nome" value="{{ grupo.nome if grupo else '' }}" placeholder="Ex.: Grupo 1" required>
</label>
<label>Turma
  <input name="turma" value="{{ (grupo.turma or '') if grupo else '' }}" placeholder="Ex.: 2º DS A">
</label>
<label class="largo">Descrição do projeto
  <textarea name="descricao" rows="3" placeholder="Ex.: Placar eletrônico para o campeonato interclasse">{{ (grupo.descricao or '') if grupo else '' }}</textarea>
</label>
<label class="largo">URL do projeto
  <input type="url" name="url" value="{{ (grupo.url or '') if grupo else '' }}" placeholder="https://usuario.github.io/projeto">
</label>
<label>Visibilidade pública
  <select name="publico">
    <option value="0" {{ 'selected' if not grupo or not grupo.publico else '' }}>Privado — não aparece nas páginas públicas</option>
    <option value="1" {{ 'selected' if grupo and grupo.publico else '' }}>Público — aparece na landing e no monitor</option>
  </select>
</label>
<label>Habilitação da API
  <select name="ativo">
    <option value="1" {{ 'selected' if not grupo or grupo.ativo else '' }}>Habilitado — pode usar token ativo</option>
    <option value="0" {{ 'selected' if grupo and not grupo.ativo else '' }}>Desabilitado — bloqueia a autenticação do grupo</option>
  </select>
</label>
<label>Origem permitida (CORS)
  <input name="origem_permitida" value="{{ (grupo.origem_permitida or '') if grupo else '' }}" placeholder="https://usuario.github.io">
  <small>Protocolo, domínio e porta (se necessário), sem caminho do projeto.</small>
</label>
<label>Restrição de origem
  <select name="restringir_origem">
    <option value="0" {{ 'selected' if not grupo or not grupo.restringir_origem else '' }}>Desativada — aceita servidor a servidor</option>
    <option value="1" {{ 'selected' if grupo and grupo.restringir_origem else '' }}>Ativada — exige a origem cadastrada</option>
  </select>
  <small>Mesmo desativada, CORS externo só é permitido para a origem cadastrada. Não é uma proteção contra cópia do token.</small>
</label>
{% if not grupo %}
<label class="largo">Integrantes (um por linha)
  <textarea name="integrantes" rows="4" placeholder="Ana Souza&#10;Bruno Lima"></textarea>
</label>
{% endif %}
