<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Administração{% endblock %} · Placar Eletrônico</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/favicon.png') }}">
  <style>
    :root { --azul:#1d4ed8; --azul-escuro:#1e3a8a; --fundo:#f4f7fb; --texto:#172033; --cinza:#64748b; --borda:#dbe3ef; --verde:#15803d; --vermelho:#b91c1c; }
    * { box-sizing:border-box; }
    html,body { height:100%; }
    /* Barra superior fixa: só a área .rolagem rola. */
    body { margin:0; background:var(--fundo); color:var(--texto); font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;
           display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }
    header { flex:none; background:var(--azul-escuro); color:white; box-shadow:0 2px 10px #0f172a26; z-index:10; }
    .rolagem { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; }
    .barra { max-width:1200px; margin:auto; padding:16px 22px; display:flex; gap:24px; align-items:center; }
    .marca { font-size:18px; font-weight:750; margin-right:auto; display:flex; align-items:center; gap:10px; color:inherit; text-decoration:none; }
    .marca img { width:34px; height:34px; padding:4px; object-fit:contain; background:white; border-radius:8px; }
    nav a { color:#dbeafe; text-decoration:none; margin-right:18px; }
    main { max-width:1200px; margin:28px auto; padding:0 22px 50px; }
    h1 { margin:0 0 22px; font-size:28px; }
    h2 { margin:28px 0 14px; font-size:19px; }
    .cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
    .card,.painel { background:white; border:1px solid var(--borda); border-radius:12px; box-shadow:0 4px 18px #1e3a8a0a; }
    .card { padding:18px; }
    .card strong { display:block; font-size:28px; margin-top:5px; }
    .rotulo { color:var(--cinza); font-size:13px; }
    .painel { padding:20px; overflow:auto; }
    table { width:100%; border-collapse:collapse; white-space:nowrap; }
    th,td { padding:11px 10px; border-bottom:1px solid #e8edf5; text-align:left; }
    th { color:var(--cinza); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    .status { display:inline-block; padding:3px 8px; border-radius:999px; font-size:12px; background:#e2e8f0; }
    .status.ok { color:var(--verde); background:#dcfce7; }
    .status.erro { color:var(--vermelho); background:#fee2e2; }
    form.linha { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
    label { display:grid; gap:5px; color:var(--cinza); font-size:13px; }
    input { min-width:220px; padding:10px 11px; border:1px solid #cbd5e1; border-radius:8px; font:inherit; }
    button,.botao { border:0; border-radius:8px; padding:10px 14px; background:var(--azul); color:white; font:inherit; font-weight:650; cursor:pointer; text-decoration:none; }
    button.secundario { background:#475569; }
    button.perigo { background:var(--vermelho); }
    .acoes { display:flex; gap:7px; }
    .acoes form { margin:0; }
    .token { padding:14px; border:1px solid #86efac; background:#f0fdf4; border-radius:9px; margin-bottom:18px; }
    .token code { display:block; padding:10px; margin-top:8px; background:#052e16; color:#dcfce7; border-radius:6px; overflow-wrap:anywhere; }
    .alerta { padding:11px 13px; border-radius:8px; margin-bottom:16px; background:#fee2e2; color:#991b1b; }
    .alerta.ok { background:#dcfce7; color:#166534; }
    textarea { width:100%; padding:10px 11px; border:1px solid #cbd5e1; border-radius:8px; font:inherit; resize:vertical; }
    form.grupo { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    form.grupo .largo { grid-column:1 / -1; }
    form.grupo input { min-width:0; width:100%; }
    form.grupo .botoes { grid-column:1 / -1; display:flex; gap:8px; justify-content:flex-end; }
    td.quebra { white-space:normal; min-width:220px; max-width:360px; }
    .detalhe { color:var(--cinza); font-size:13px; margin-top:3px; }
    .linha-grupo { cursor:pointer; }
    .linha-grupo:hover,.linha-grupo:focus-within { background:#eff6ff; }
    .integrantes { margin:0; padding-left:18px; }
    @media(max-width:700px) { form.grupo { grid-template-columns:1fr; } }
    table.integrantes-tabela { white-space:normal; }
    table.integrantes-tabela td { vertical-align:middle; }
    table.integrantes-tabela .col-id { width:70px; color:var(--cinza); font-variant-numeric:tabular-nums; }
    table.integrantes-tabela .col-acoes { width:110px; }
    table.integrantes-tabela input { width:100%; min-width:0; }
    .icone { display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; padding:0; border-radius:8px; }
    .icone svg { width:18px; height:18px; }
    .acoes-grupo { gap:5px; align-items:center; }
    .acoes-grupo .icone { width:32px; height:32px; padding:0; border-radius:6px; }
    .acoes-grupo .icone svg { width:16px; height:16px; }
    .acoes-grupo .icone { transition:filter .15s,box-shadow .15s,transform .15s; }
    .acoes-grupo .icone:hover { filter:brightness(1.16); box-shadow:0 2px 6px #0f172a40; transform:translateY(-1px); }
    .acoes-grupo .icone:active { transform:translateY(0); filter:brightness(.95); }
    .acoes-grupo .icone:focus-visible,.switch-grupo:focus-visible { outline:2px solid var(--azul-escuro); outline-offset:3px; }
    .form-habilitacao { margin:0; }
    .switch-grupo { display:inline-flex; align-items:center; gap:8px; padding:4px; border:0; border-radius:6px; background:transparent; color:var(--texto); font:inherit; font-weight:600; white-space:nowrap; cursor:pointer; transition:background .15s; }
    .switch-grupo:hover { background:#e8edf5; }
    .switch-grupo:active { background:#dbe3ef; }
    .switch-trilho { position:relative; display:inline-block; width:42px; height:24px; flex:none; border-radius:999px; background:#64748b; transition:background .15s,box-shadow .15s; }
    .switch-pino { position:absolute; top:3px; left:3px; display:flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; background:white; color:#15803d; transition:transform .15s; }
    .switch-pino svg { width:12px; height:12px; }
    .switch-grupo[aria-checked="true"] .switch-trilho { background:var(--verde); }
    .switch-grupo[aria-checked="true"] .switch-pino { transform:translateX(18px); }
    .switch-grupo:hover .switch-trilho { box-shadow:0 0 0 3px #cbd5e1; }
    .switch-texto { color:#475569; font-size:12px; }
    .switch-grupo[aria-checked="true"] .switch-texto { color:#166534; }
    @media(prefers-reduced-motion:reduce) { .acoes-grupo .icone,.switch-grupo,.switch-trilho,.switch-pino { transition:none; } .acoes-grupo .icone:hover { transform:none; } }
    .icone.salvar { background:var(--azul); }
    .icone.remover { background:var(--vermelho); }
    dialog.confirmar { border:0; border-radius:12px; padding:22px; max-width:400px; width:calc(100% - 32px); box-shadow:0 20px 50px #0f172a40; }
    dialog.confirmar::backdrop { background:#0f172a80; }
    dialog.confirmar h3 { margin:0 0 8px; font-size:18px; }
    dialog.confirmar p { margin:0 0 18px; color:var(--cinza); }
    dialog.confirmar .botoes { display:flex; gap:8px; justify-content:flex-end; }
    .login { max-width:430px; margin:70px auto; }
    .login form { display:grid; gap:14px; }
    .login input { width:100%; min-width:0; }
    .metodos { display:flex; gap:8px; flex-wrap:wrap; }
    .metodo { padding:7px 10px; background:#eff6ff; color:#1e40af; border-radius:8px; }
    @media(max-width:800px) { .cards { grid-template-columns:repeat(2,1fr); } .barra { align-items:flex-start; flex-wrap:wrap; } nav { order:3; width:100%; } }
    @media(max-width:480px) { .cards { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  {% if session.get("admin_autenticado") %}
  <header>
    <div class="barra">
      <a class="marca" href="{{ url_for('admin.dashboard') }}"><img src="{{ url_for('static', filename='icons/favicon.png') }}" alt="">Placar Eletrônico</a>
      <nav>
        <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin.grupos') }}">Grupos e tokens</a>
        <a href="/exemplos/campeonato/configuracao">Configurar Campeonato</a>
        <a href="/exemplos/placar-eletronico/configuracao">Configurar Placar Eletrônico</a>
      </nav>
      <form method="post" action="{{ url_for('admin.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="secundario" type="submit">Sair</button>
      </form>
    </div>
  </header>
  {% endif %}
  <div class="rolagem">
  <main>
    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
      <div class="alerta {{ categoria }}">{{ mensagem }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  </div>
</body>
</html>
